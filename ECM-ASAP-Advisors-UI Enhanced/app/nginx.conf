# nginx config for the ECM Reconciliation Suite SPA.
# - SPA fallback so client-side routes (react-router) resolve to index.html
# - index.html served no-cache; hashed /assets cached long
# - /core-api proxied to the Pucho Core API, mirroring the Vite dev proxy so
#   the browser is not blocked by CORS in production (the app calls /core-api).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy the Pucho Core API (mirrors vite.config.js dev proxy).
  location /core-api/ {
    proxy_pass https://core-api.pucho.ai/;
    proxy_ssl_server_name on;
    proxy_set_header Host core-api.pucho.ai;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed, immutable build assets — cache aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache the entry document — new deploys take effect immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
