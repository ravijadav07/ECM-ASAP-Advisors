# Pucho myapps platform — Nginx configuration for the ECM Reconciliation Suite.
# This file must be placed in the deployment root so the platform picks it up.
# If the platform uses Docker (Dockerfile), nginx.conf is already copied to
# /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Tally Core API proxy (same-origin → no CORS) ──
  # The SPA calls /core-api/fapi/v1/... and nginx forwards it to
  # https://core-api.pucho.ai/. Without this, the browser is blocked
  # by CORS because core-api.pucho.ai does not return CORS headers.
  location /core-api/ {
    proxy_pass https://core-api.pucho.ai/;
    proxy_ssl_server_name on;
    proxy_set_header Host core-api.pucho.ai;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Tally queries can take 2-5 minutes for large date ranges
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
  }

  # Hashed build assets — cache aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache index.html — new deploys take effect immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}